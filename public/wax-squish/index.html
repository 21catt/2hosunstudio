    v: nrm.multiplyScalar(sp * 0.42).add(new THREE.Vector3((Math.random() - 0.5) * 0.6, 0.4 + Math.random() * 0.9, (Math.random() - 0.5) * 0.6)),
    w: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(4 + Q * 6), life: Infinity, nLocal: new THREE.Vector3(...c.n), mat })
  for (let j = 0; j < Math.round((2 + power * 4) * (0.4 + Q * 1.8)); j++) {
    const cm = new THREE.Mesh(crumbGeo, crumbMat); cm.position.copy(wp); cm.scale.setScalar(0.4 + Math.random() * 0.8); cm.renderOrder = 20; scene.add(cm)
    frags.push({ dust: true, mesh: cm, v: new THREE.Vector3((Math.random() - 0.5) * 3, 1 + Math.random() * 2.5, (Math.random() - 0.5) * 3 + 1).multiplyScalar(0.3 + Q * 0.7), w: new THREE.Vector3(5, 7, 3), life: 1.4, mat: null })
  }
  shake = Math.min(0.02 + 0.08 * Q, shake + 0.025 * power * (0.3 + Q * 1.4))
  squashKick += 0.04 * power * (0.4 + Q * 1.2)
  const bright = 1 - L.i / 2
  SFX.crack((0.25 + power * 0.4) * (0.6 + Q * 0.8), bright); buzz(Math.round((10 + power * 14) * (0.5 + Q)))
  post({ scene: 'touch' })
  if (!L.clusters.some(k => k.alive)) {
    SFX.clear(L.i + 1); buzz(40)
    setTimeout(() => toast(L.i < 2 ? `${L.i + 1}단계 다 깼어요! 다음 겹으로` : '다 부쉈어요! 🐾'), 80)
    post({ wax: 'stage', n: L.i + 1 })
  }
  report()
}
// 금은 번져 나간다 — 옆 조각으로 40~110ms 뒤 틱, 틱(왁스 판이 갈라지는 소리)
const spread = []
function crackCluster(L, c) {
  if (c.cracked || !c.alive) return
  c.cracked = true; c.line.visible = true
  SFX.tick(1 - L.i / 2); buzz(6)
  const Q = PW(), reach = 0.36 + Q * 0.2
  for (const k of L.clusters) if (k !== c && k.alive && !k.cracked && Math.hypot(k.c[0] - c.c[0], k.c[1] - c.c[1], k.c[2] - c.c[2]) < reach)
    spread.push({ at: performance.now() + 40 + Math.random() * 70, L, k, add: 0.1 + Q * 0.25 })
}

// 휜 정도(그 조각 자리의 변형률)
function strainAt(c) {
  if (!built) return 0
  const W = built.w, H = built.h, [x, y, z] = c.c
  const sb = Math.abs(U.uBend.value) * Math.exp(-((x / (W * 0.32)) ** 2)) * (1.1 + Math.abs(z))
  const sv = Math.abs(U.uBendV.value) * Math.exp(-((y / (H * 0.32)) ** 2)) * (1.1 + Math.abs(z))
  const st = Math.abs(U.uTwist.value) * (Math.abs(y) + Math.abs(z) * 0.6) * 1.15
  const ss = U.uSquash.value * 2.2
  return sb + sv + st + ss
}

// ───────── 손 입력 ─────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
const ptrs = new Map()
let grab = null   // { mode, x0, y0, side, bend0 ... }
let orbit = null
let shake = 0, squashKick = 0
const tgt = { bend: 0, bendV: 0, twist: 0, squash: 0 }
const vel = { bend: 0, bendV: 0, twist: 0, squash: 0 }
let yaw = -0.3, pitch = 0.5, yawV = 0 // 자료처럼 위에서 비스듬히 — 판의 두께가 보이게

function pickAt(cx, cy) {
  const r = canvas.getBoundingClientRect()
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1)
  ray.setFromCamera(ndc, camera)
  const objs = [built.core]
  const L = current()
  if (L && coatT >= 1) for (const c of L.clusters) if (c.alive) objs.push(c.mesh)
  const hit = ray.intersectObjects(objs, false)[0]
  if (!hit) return null
  const local = body.worldToLocal(hit.point.clone())
  const cl = L && coatT >= 1 ? L.clusters.find(c => c.mesh === hit.object) : null
  return { local, cluster: cl, L }
}
function tapAt(info) {
  if (!info || phase !== 'crush') return false
  const L = current(); if (!L || coatT < 1) return false
  let c = info.cluster
  if (!c) { // 본체를 눌렀으면 가장 가까운 조각
    let bd = 0.7; for (const k of L.clusters) { if (!k.alive) continue; const d = Math.hypot(k.c[0] - info.local.x, k.c[1] - info.local.y, (k.c[2] - info.local.z) * 0.5); if (d < bd) { bd = d; c = k } }
  }
  if (!c) return false
  squashKick += 0.03
  const P = PW()
  if (c.cracked || P > 0.85) breakCluster(L, c, 0.6 + P * 0.5)
  else { crackCluster(L, c); c.dmg = Math.max(c.dmg, 0.35 + P * 0.35) }
  // 옆 조각에도 금
  for (const k of L.clusters) if (k !== c && k.alive && Math.hypot(k.c[0] - c.c[0], k.c[1] - c.c[1], k.c[2] - c.c[2]) < 0.4 + P * 0.35) { k.dmg += 0.08 + P * 0.32; if (k.dmg > 0.4) crackCluster(L, k); if (P > 0.7 && k.dmg > k.need) breakCluster(L, k, P) }
  return true
}

canvas.addEventListener('pointerdown', e => {
  au()
  canvas.setPointerCapture?.(e.pointerId)
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() })
  if (!built) return
  if (ptrs.size === 2) { // 두 손가락 = 꾹 누르기 · 비틀기
    const [a, b] = [...ptrs.values()]
    grab = { two: true, d0: Math.hypot(a.x - b.x, a.y - b.y), a0: Math.atan2(b.y - a.y, b.x - a.x), sq0: tgt.squash, tw0: tgt.twist }
    orbit = null; canvas.classList.add('grabbing'); return
  }
  const info = pickAt(e.clientX, e.clientY)
  if (info) {
    const side = info.local.x / (built.w / 2) // -1 … 1
    grab = { two: false, x0: e.clientX, y0: e.clientY, side, edge: Math.abs(side) > 0.45, info, moved: 0, b0: tgt.bend, bv0: tgt.bendV, tw0: tgt.twist }
    canvas.classList.add('grabbing')
    if (phase === 'crush') SFX.squish()
  } else {
    orbit = { x: e.clientX, y: e.clientY, yaw, pitch }
  }
})
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return
  p.x = e.clientX; p.y = e.clientY
  if (!built) return
  const r = canvas.getBoundingClientRect(), S = Math.min(r.width, r.height)
  if (grab?.two && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()]
    const d = Math.hypot(a.x - b.x, a.y - b.y), an = Math.atan2(b.y - a.y, b.x - a.x)
    tgt.squash = Math.max(0, Math.min(0.32, grab.sq0 + (grab.d0 - d) / S * 0.9))
    let da = an - grab.a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI
    tgt.twist = Math.max(-2.2, Math.min(2.2, grab.tw0 + da * 1.8))
    return
  }
  if (grab && !grab.two) {
    const dx = (e.clientX - grab.x0) / S, dy = (e.clientY - grab.y0) / S
    grab.moved = Math.max(grab.moved, Math.hypot(e.clientX - grab.x0, e.clientY - grab.y0))
    // 손 쪽으로 끌면 구부러진다 · 가장자리를 위아래로 = 비틀기
    tgt.bend = Math.max(-2, Math.min(2, grab.b0 + dx * 3.6)) // 반죽처럼 크게 휜다
    if (grab.edge) tgt.twist = Math.max(-2.2, Math.min(2.2, grab.tw0 - dy * 3.8 * Math.sign(grab.side)))
    else tgt.bendV = Math.max(-2, Math.min(2, grab.bv0 + dy * 3.6))
    return
  }
  if (orbit) { yaw = orbit.yaw + (e.clientX - orbit.x) / S * 4; pitch = Math.max(-0.6, Math.min(0.7, orbit.pitch + (e.clientY - orbit.y) / S * 2.5)) }
})
function up(e) {
  const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId)
  if (grab && !grab.two && p && grab.moved < 10 && performance.now() - p.t < 350) tapAt(grab.info)
  if (grab && (ptrs.size === 0 || grab.two)) { tgt.bend = tgt.bendV = tgt.twist = tgt.squash = 0; grab = null; canvas.classList.remove('grabbing') }
  if (ptrs.size === 0) orbit = null
}
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up)
canvas.addEventListener('contextmenu', e => e.preventDefault())
$('rs').addEventListener('click', () => restore())

// 부모 화면이 시키는 일
addEventListener('message', e => {
  if (e.origin !== location.origin) return
  const d = e.data || {}
  if (d.wax === 'config') { const prev = cfg; cfg = readCfg(); if (prev.cat !== cfg.cat || prev.art !== cfg.art) build(); else { recolor() } }
  else if (d.wax === 'colors') { cfg = readCfg(); recolor() }
  else if (d.wax === 'phase') { const was = phase; phase = d.phase; if (phase === 'pick') coatT = 0; else if (was === 'pick' || was === 'draw') { coatT = 0.0001; SFX.coat() } }
  else if (d.wax === 'power') { cfg.power = Math.max(0, Math.min(1, +d.v || 0)) }
  else if (d.wax === 'reset' || d.cmd === 'reset') restore()
})
addEventListener('storage', e => { if (e.key && e.key.startsWith('2hs_wax_')) { const prev = cfg; cfg = readCfg(); if (prev.cat !== cfg.cat || prev.art !== cfg.art) build(); else recolor() } })

// ───────── 크기 맞추기 ─────────
function fit() {
  const w = innerWidth, h = innerHeight
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  const need = built ? Math.max(built.w, built.h) + 1.6 : 3.5
  const fov = camera.fov * Math.PI / 180
  let dist = (need / 2) / Math.tan(fov / 2) * 1.12
  if (camera.aspect < 1) dist /= Math.max(0.55, camera.aspect)
  camera.position.set(0, EMBED ? 0.35 : 0.25, dist)
  camera.lookAt(0, EMBED ? 0.1 : -0.05, 0)
  camera.updateProjectionMatrix()
  if (built) { const sc = 1; body.scale.setScalar(sc); shadow.scale.set(built.w / 2.6 + 0.3, 1, 1) }
}
addEventListener('resize', fit)

// ───────── 그리기 루프 ─────────
let last = performance.now(), idle = 0
function frame(now) {
  requestAnimationFrame(frame)
  step(now)
}
function step(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = Math.max(last, now)
  // 휘기 스프링 — 손을 놓으면 말랑하게 튕겨 돌아온다
  for (const k of ['bend', 'bendV', 'twist', 'squash']) {
    const uk = 'u' + k[0].toUpperCase() + k.slice(1)
    const cur = U[uk].value
    const stiff = grab ? 60 : 55, damp = grab ? 13 : 9 // 놓으면 천천히 말랑하게 돌아온다
    vel[k] += ((tgt[k] - cur) * stiff - vel[k] * damp) * dt
    U[uk].value = cur + vel[k] * dt
  }
  squashKick *= Math.pow(0.02, dt)
  U.uSquash.value = Math.max(-0.1, U.uSquash.value + squashKick * Math.sin(now / 40) * 0.0)
  // 금 가기 · 부서지기 — 지금 깨는 겹만
  if (built && phase === 'crush' && coatT >= 1) {
    const L = current()
    if (L) {
      let maxS = 0
      for (const c of L.clusters) {
        if (!c.alive) continue
        const s = strainAt(c); if (s > maxS) maxS = s
        const P = PW(), th = 0.5 - P * 0.32
        if (s > th) c.dmg += (s - th) * dt * 1.4 * (0.35 + P * 1.9)
        if (c.dmg > 0.35) crackCluster(L, c)
        if (c.dmg > c.need) breakCluster(L, c, Math.min(1, s))
      }
      if (grab && maxS > 0.4 && Math.random() < dt * 6) SFX.creak(Math.min(1, maxS - 0.4))
    }
  }
  for (let i = spread.length - 1; i >= 0; i--) {
    const sp = spread[i]; if (now < sp.at) continue
    spread.splice(i, 1)
    if (!sp.k.alive || coatT < 1) continue
    sp.k.dmg += sp.add
    if (sp.k.dmg > 0.4) crackCluster(sp.L, sp.k)
  }
  // 왁스 입히기(안쪽 겹부터)
  if (built) {
    if (phase !== 'pick' && coatT < 1) coatT = Math.min(1, coatT + dt / 0.9)
    built.layers.forEach((L, i) => {
      const j = 2 - i // 안쪽(3단계)부터
      const a = phase === 'pick' ? 0 : Math.max(0, Math.min(1, coatT * 3 - j))
      L.group.visible = a > 0
      L.group.scale.setScalar(0.92 + 0.08 * a)
      const base = (WAX[cfg.colors[i]] || WAX.milk)[1] * 0.85
      L.mat.opacity = base * a
      // 응력 자국: 금이 갈수록 그 조각이 하얗고 불투명해진다(진짜 왁스처럼)
      for (const c of L.clusters) {
        if (!c.alive) continue
        const st = Math.min(1, c.dmg / c.need)
        c.mat.color.copy(L.mat.color).lerp(WHITE, 0.62 * st * st)
        c.mat.opacity = Math.min(0.95, L.mat.opacity + 0.55 * st * a)
      }
    })
  }
  // 날아가는 조각 · 바닥에 쌓인 판(너무 많으면 오래된 것부터 치운다)
  while (frags.filter(f => f.flake).length > 180) { const k = frags.findIndex(f => f.flake); const f = frags[k]; scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mat.dispose(); frags.splice(k, 1) }
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i]
    if (f.peel > 0) { // 떼어지는 중 — 표면에서 살짝 들린다
      f.peel -= dt; f.mesh.position.addScaledVector(f.out, dt * 0.35)
      f.mesh.rotateOnAxis(f.out, dt * 0.6)
    } else {
      f.v.y -= (f.flake ? 6.5 : 9.8) * dt
      if (f.flake) f.v.multiplyScalar(Math.pow(0.55, dt)) // 얇은 판은 공기에 팔랑
      f.mesh.position.addScaledVector(f.v, dt)
      f.mesh.rotation.x += f.w.x * dt; f.mesh.rotation.y += f.w.y * dt; f.mesh.rotation.z += f.w.z * dt
      if (f.landed) { // 바닥에 닿은 판 = 납작하게 눕고 미끄러지다 멈춘다(쌓여 남는다)
        f.st = Math.min(1, f.st + dt * 5); f.mesh.quaternion.slerpQuaternions(f.qFrom, f.qTo, f.st)
        f.v.set(f.v.x * Math.pow(0.02, dt), 0, f.v.z * Math.pow(0.02, dt)); f.mesh.position.y = f.restY
      } else if (f.mesh.position.y < FLOOR + 0.03 && f.v.y < 0) {
        if (f.flake && f.v.y > -1.2) {
          const wn = f.nLocal.clone().applyQuaternion(f.mesh.quaternion), up = new THREE.Vector3(0, wn.y >= 0 ? 1 : -1, 0)
          f.qFrom = f.mesh.quaternion.clone(); f.qTo = new THREE.Quaternion().setFromUnitVectors(wn, up).multiply(f.mesh.quaternion); f.st = 0
          f.landed = true; f.w.set(0, 0, 0); f.restY = FLOOR + 0.02 + (floorPile++ % 40) * 0.0012 // 겹겹이
        } else { f.mesh.position.y = FLOOR + 0.03; f.v.y *= -0.3; f.v.x *= 0.6; f.v.z *= 0.6; f.w.multiplyScalar(0.4) }
      }
    }
    f.life -= dt
    if (f.dust && f.mesh.position.y <= FLOOR + 0.035) f.life = Math.min(f.life, 0.0) // 가루는 닿으면 사라짐
    if (f.mat && f.life === Infinity) continue
    if (f.mat) f.mat.opacity = Math.max(0, Math.min(f.mat.userData.o ?? (f.mat.userData.o = f.mat.opacity), f.life * 1.5))
    if (f.life <= 0) { scene.remove(f.mesh); if (f.mat) { f.mesh.geometry.dispose(); f.mat.dispose() } frags.splice(i, 1) }
  }
  // 돌려 보기 · 쉬는 동안 살짝 흔들
  if (!orbit && !grab) { idle += dt; yaw += Math.sin(idle * 0.6) * dt * 0.08 }
  root.rotation.set(pitch, yaw, 0)
  body.position.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0)
  shake *= Math.pow(0.01, dt)
  const sk = squashKick
  body.scale.set(1 + sk, 1 - sk * 1.4, 1 + sk)
  renderer.render(scene, camera)
}
fit()
build().then(() => requestAnimationFrame(frame))
window.__wax3d = { step, get coatT() { return coatT }, get built() { return built }, U, tgt, get phase() { return phase }, restore, breakCluster, current, strainAt, setPhase: p => { phase = p; if (p !== 'pick') coatT = 1 } }
post({ wax: 'ready' })
</script>
</body>
</html>
