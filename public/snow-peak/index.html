  if (Math.abs(nt - dayNight.painted) > 0.004) { dayNight.painted = nt; paintSky(nt)
    hemi.color.copy(lerpC('#eef3fa', '#9fb0e0', nt)); hemi.groundColor.copy(lerpC('#cbb9a2', '#4a4766', nt)); hemi.intensity = 1.35 - nt * 0.6
    sun.color.copy(lerpC('#ffeedb', '#b9c9ff', nt)); sun.intensity = 1.9 - nt * 1.2
    renderer.toneMappingExposure = 1.12 - nt * 0.12; scene.fog.color.copy(lerpC('#e3e3e1', '#232b4a', nt))
    starMat.opacity = Math.max(0, nt * 1.15 - 0.15); moon.material.opacity = nt; moonGlow.material.opacity = nt * 0.35
    document.body.classList.toggle('night', nt > 0.5) }
  // 집 창 — 켜 둔 집은 밤에 더 따뜻하게, 끈 집은 어둡게
  for (const h of houses) { const on = h.userData.on, m = h.userData.win
    m.emissiveIntensity = on ? 0.9 + nt * 2.4 : 0.03; m.color.set(on ? '#ffd98a' : '#6f6c7a'); h.userData.glow.material.opacity = on ? nt * 0.75 : 0 }
  for (const l of trainLights) l.mat.emissiveIntensity = l.base + nt * l.night
  for (const g of trainGlows) g.s.material.opacity = nt * g.max
  // 루돌프 코 — 늘 빨갛고, 밤엔 두근두근 빛난다
  const beat = 0.75 + 0.25 * Math.sin(now * 0.006)
  for (const d0 of deer) if (d0.userData.nose) { d0.userData.nose.emissiveIntensity = 1.6 + nt * 4 * beat; d0.userData.noseGlow.material.opacity = 0.15 + nt * 0.85 * beat; d0.userData.noseGlow.scale.setScalar(0.45 + nt * 0.35 * beat) }
}

// ── 움직임 ──
const tmp = new THREE.Vector3(), chimney = new THREE.Vector3(0.38, 0.95, 0)
function trainPuff(boost = 1) { tmp.copy(chimney); loco.localToWorld(tmp); emit('train', tmp, new THREE.Vector3((Math.random() - 0.5) * 0.15, 0.55 * boost + Math.random() * 0.3, (Math.random() - 0.5) * 0.15), 2.4, 1.15 * boost) }
let puffT = 0, peakT = 0, last = performance.now(), statT = 0
const _t = new THREE.Vector3(), _y = new THREE.Vector3(), _z = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0), _m = new THREE.Matrix4()
// 철길 위 거리 s 에 놓고, 오르막·내리막 기울기를 따라 앞을 향하게
function placeCar(g, s) {
  const u = ((s / TLEN) % 1 + 1) % 1, p = track.getPointAt(u); _t.copy(track.getTangentAt(u))
  _z.crossVectors(_t, _up).normalize(); _y.crossVectors(_z, _t).normalize(); _z.crossVectors(_t, _y)
  _m.makeBasis(_t, _y, _z); g.quaternion.setFromRotationMatrix(_m); g.position.set(p.x, p.y + 0.05, p.z)
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  const run = !st.paused
  if (run) {
    const v = 0.3 + st.speed * 1.5                   // 철길 위 빠르기(칸/초) — 오르막은 조금 느리게, 내리막은 조금 빠르게
    const slope = track.getTangentAt(((st.theta / TLEN) % 1 + 1) % 1).y
    const prev = st.theta; st.theta += v * (1 - slope * 1.6) * dt; if (Math.floor(st.theta / TLEN) > Math.floor(prev / TLEN)) st.lap++
    if (!cam.drag) { cam.autoz = Math.min(1, cam.autoz + dt * 0.3); cam.az += dt * 0.035 * cam.autoz }
  }
  for (const c of cars) placeCar(c.g, st.theta - c.back)
  stepSanta(dt, now); stepNight(dt, now)
  // 기차 연기
  puffT -= dt; if (run && puffT <= 0) { puffT = 0.16 / (0.5 + st.speed); trainPuff() }
  // 집 굴뚝 연기 — 가늘게
  for (const ch of chimneys) { ch.t -= dt; if (ch.t <= 0) { ch.t = 0.9 + Math.random() * 0.6; tmp.copy(ch.local); ch.g.localToWorld(tmp); emit('chim', tmp, new THREE.Vector3(0.06, 0.28, 0), 2.6, 0.32) } }
  // 꼭대기 연기
  peakT -= dt; if (peakT <= 0) { peakT = 0.45; tmp.set((Math.random() - 0.5) * 0.3, MH - 0.15, (Math.random() - 0.5) * 0.3); tmp.applyMatrix4(island.matrixWorld); emit('peak', tmp, new THREE.Vector3(0.35 + Math.random() * 0.15, 0.5 + Math.random() * 0.2, 0.05), 6, 1.6) }
  for (const p of puffs) { if (p.life <= 0) continue
    p.life -= dt; if (p.life <= 0) { p.s.visible = false; continue }
    const f = 1 - p.life / p.max
    if (p.kind === 'flake') { p.v.y -= 1.2 * dt; p.s.position.addScaledVector(p.v, dt); p.s.scale.setScalar(p.g * 0.25); p.s.material.opacity = (1 - f) * 0.95 }
    else { if (p.kind === 'peak') p.v.x += 0.05 * dt; p.v.y *= 1 - dt * 0.25; p.s.position.addScaledVector(p.v, dt); p.s.scale.setScalar(p.g * (0.35 + f * (p.kind === 'peak' ? 2.4 : p.kind === 'chim' ? 2 : 1.4))); p.s.material.opacity = Math.min(1, f * 6) * (1 - f) * (p.kind === 'peak' ? 0.7 : p.kind === 'chim' ? 0.45 : 0.85) }
  }
  // 소나무 흔들림 · 산 살짝 떨림
  for (const g of pines) if (g.userData.shake > 0) { g.userData.shake = Math.max(0, g.userData.shake - dt * 1.6); g.rotation.z = Math.sin(now * 0.03) * 0.12 * g.userData.shake }
  if (st.shakeMtn > 0) { st.shakeMtn = Math.max(0, st.shakeMtn - dt * 2); mountain.position.x = Math.sin(now * 0.08) * 0.025 * st.shakeMtn }
  // 눈 내리기(아래로 내려와 바닥 밑이면 위로)
  if (run) { const a = snowGeo.attributes.position.array, t = now * 0.001
    for (let i = 0; i < SNOW; i++) { const s = sd[i], k = i * 3; a[k + 1] -= (0.5 + s * 0.6) * dt; a[k] += Math.sin(t * 0.7 + s * 40) * 0.12 * dt; a[k + 2] += Math.cos(t * 0.6 + s * 31) * 0.1 * dt
      if (a[k + 1] < -1) { a[k + 1] = 16; } }
    snowGeo.attributes.position.needsUpdate = true }
  // 떠 있는 섬
  island.position.y = Math.sin(now * 0.0007) * 0.12; island.rotation.z = Math.sin(now * 0.0005) * 0.01
  frame(); renderer.render(scene, camera)
  statT += dt; if (statT > 0.4 && !EMBED) { statT = 0; elStatus.textContent = `Lap ${st.lap} · ${snowMat.uniforms.uAmt.value > 0.05 ? 'snowing' : 'clear'}${st.paused ? ' · paused' : ''}` }
  requestAnimationFrame(loop)
}
document.addEventListener('visibilitychange', () => { last = performance.now() })
window.__peak = { night: () => ({ ...dayNight }), dirs: () => { const fwd = o => new THREE.Vector3(1, 0, 0).applyQuaternion(o.quaternion); const toLead = deer[0].position.clone().sub(sleigh.position).normalize(); const motion = fly.trail[0].clone().sub(fly.trail[6]).normalize(); const tp = trailPoint(SPOT[5]); return { trailDirMotion: +tp.dir.dot(motion).toFixed(2), trailLen: fly.trail.length, sleighFwdToLead: +fwd(sleigh).dot(toLead).toFixed(2), deerFwdMotion: +fwd(deer[0]).dot(motion).toFixed(2), sleighFwdMotion: +fwd(sleigh).dot(motion).toFixed(2) } }, gifts: () => gifts.map(q => [q.landed, +q.g.position.y.toFixed(2)]), lead: () => fly.lead.toArray().map(v => +v.toFixed(2)), sleighScreen: () => { const v = sleigh.getWorldPosition(new THREE.Vector3()).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight] }, st, cam, play: n => (n === 'whistle' ? whistle() : 0), cars: () => cars.map(c => c.g.position.toArray().map(v => +v.toFixed(2))) }
requestAnimationFrame(loop)
</script>
