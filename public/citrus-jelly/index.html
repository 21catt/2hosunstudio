<script>

// ───────────────────────── cyclorama paper sweep ─────────────────────────
function cyclorama() {
  const prof = [] // (y, z, ny, nz)
  for (let z = 9; z > -1.0; z -= 0.5) prof.push([0, z, 1, 0])
  const RAD = 3.0, Z0 = -1.0
  for (let k = 0; k <= 16; k++) { const a = k / 16 * Math.PI / 2; prof.push([RAD - RAD * Math.cos(a), Z0 - RAD * Math.sin(a), Math.cos(a), Math.sin(a)]) }
  for (let y = RAD + 0.5; y <= 12; y += 0.5) prof.push([y, Z0 - RAD, 0, 1])
  const XS = []; for (let xx = -14; xx <= 14; xx += 1) XS.push(xx)
  const v = [], idx = []
  for (const [y, z, ny, nz] of prof) for (const xx of XS) v.push(xx, y, z, 0, ny, nz)
  const W = XS.length
  for (let r = 0; r < prof.length - 1; r++) for (let c = 0; c < W - 1; c++) {
    const a = r * W + c, b = a + 1, cc = a + W, d = cc + 1
    idx.push(a, b, cc, b, d, cc)
  }
  return { v: new Float32Array(v), i: new Uint32Array(idx) }
}

    const dpr = Math.min(window.devicePixelRatio || 1, innerWidth < 720 ? 1.5 : 2)
    const w = Math.max(2, Math.floor(innerWidth * dpr)), h = Math.max(2, Math.floor(innerHeight * dpr))
    if (w === W && h === H) return
    W = w; H = h; canvas.width = w; canvas.height = h
    for (const t of [sceneT, backT, jellyT, depthA, depthB]) t?.destroy()
    const tex = (format, extra = 0) => device.createTexture({ size: [w, h], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | extra })
    sceneT = tex(HDR); backT = tex(HDR); jellyT = tex(HDR); depthA = tex('depth24plus'); depthB = tex('depth24plus')
    jellyBG = device.createBindGroup({ layout: jellyP.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }, { binding: 1, resource: sceneT.createView() }, { binding: 2, resource: backT.createView() }, { binding: 3, resource: linSmp }] })
    postBG = device.createBindGroup({ layout: postP.getBindGroupLayout(0), entries: [{ binding: 0, resource: sceneT.createView() }, { binding: 1, resource: jellyT.createView() }, { binding: 2, resource: { buffer: pbuf } }] })
  }
  addEventListener('resize', resize); resize()

  // camera
  let viewProj, invVP, eye
  function camera() {
    const asp = W / H
    const fov = asp < 1 ? Math.min(1.25, 0.56 / asp * 0.82) : 0.56
    const dist = asp < 1 ? 5.6 : 5.4
    eye = [0, 1.5, dist]
    const at = [0, asp < 1 ? 0.25 : 0.5, 0]
    viewProj = mat4Mul(perspective(fov, asp, 0.1, 60), lookAt(eye, at, [0, 1, 0]))
    invVP = invert4(viewProj)
  }
  camera() // ready before the first frame — a touch can come early
  const lightVP = mat4Mul(ortho(-2.6, 2.6, -2.6, 2.6, 0.1, 8.0), lookAt([0, 6, 0.7], [0, 0, 0.7], [0, 0, -1]))

  // ── input: grab a surface point, pull the patch ──
  function rayFrom(cx, cy) {
    const r = canvas.getBoundingClientRect()
    const nx = (cx - r.left) / r.width * 2 - 1, ny = -((cy - r.top) / r.height * 2 - 1)
    const p0 = mul4(invVP, [nx, ny, 0, 1]), p1 = mul4(invVP, [nx, ny, 1, 1])
    const a = [p0[0] / p0[3], p0[1] / p0[3], p0[2] / p0[3]], b = [p1[0] / p1[3], p1[1] / p1[3], p1[2] / p1[3]]
    return { o: a, d: V.norm(V.sub(b, a)) }
  }
  function mul4(m, v) { const o = [0, 0, 0, 0]; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) o[r] += m[c * 4 + r] * v[c]; return o }
  function pick(ray) {
    let best = 1e9, hit = null
    for (let i = 0; i < IDX.length; i += 3) {
      const a = IDX[i] * 6, b = IDX[i + 1] * 6, c = IDX[i + 2] * 6
      const A = [RVB[a], RVB[a + 1], RVB[a + 2]], e1 = [RVB[b] - A[0], RVB[b + 1] - A[1], RVB[b + 2] - A[2]], e2 = [RVB[c] - A[0], RVB[c + 1] - A[1], RVB[c + 2] - A[2]]
      const pv = V.cross(ray.d, e2), det = V.dot(e1, pv)
      if (Math.abs(det) < 1e-9) continue
      const tv = V.sub(ray.o, A), uu = V.dot(tv, pv) / det; if (uu < 0 || uu > 1) continue
      const qv = V.cross(tv, e1), vv = V.dot(ray.d, qv) / det; if (vv < 0 || uu + vv > 1) continue
      const t = V.dot(e2, qv) / det
      if (t > 0 && t < best) { best = t; hit = V.add(ray.o, V.mul(ray.d, t)) }
    }
    return hit
  }
  let dragPlane = null
  canvas.addEventListener('pointerdown', e => {
    const ray = rayFrom(e.clientX, e.clientY)
    const h = pick(ray)
    if (!h) return
    try { canvas.setPointerCapture(e.pointerId) } catch {} canvas.classList.add('grabbing')
    const RAD = 0.36, idx = [], w = [], off = []
    for (let i = 0; i < NP; i++) {
      const d = V.len(V.sub(p3(x, i), h))
      if (d < RAD) { idx.push(i); w.push(1 - (d / RAD) ** 2); const o = V.sub(p3(x, i), h); off.push(o[0], o[1], o[2]) }
    }
    if (!idx.length) return
    const fwd = V.norm(V.sub(h, eye))
    dragPlane = { n: fwd, p: h }
    grab = { idx, w, off, target: h.slice(), goal: h.slice(), anchor: h.slice() }
    e.preventDefault()
  })
  canvas.addEventListener('pointermove', e => {
    if (!grab || !dragPlane) return
    const ray = rayFrom(e.clientX, e.clientY)
    const den = V.dot(dragPlane.n, ray.d); if (Math.abs(den) < 1e-6) return
    const t = V.dot(V.sub(dragPlane.p, ray.o), dragPlane.n) / den
    let p = V.add(ray.o, V.mul(ray.d, t))
    // bounded reach: strong pull, never unbounded
    const d = V.sub(p, grab.anchor), dl = V.len(d), MAX = 1.25
    if (dl > MAX) p = V.add(grab.anchor, V.mul(d, MAX / dl))
    // never crush the held patch into the floor — lift the patch instead
    let minY = 1e9; for (let n = 0; n < grab.idx.length; n++) minY = Math.min(minY, p[1] + grab.off[n * 3 + 1])
    if (minY < 0.015) p[1] += 0.015 - minY
    grab.goal = p
  })
  const release = () => {
    if (grab) for (let i = 0; i < NP; i++) { // let go softly: a flick shouldn't throw it across the set
      const k = i * 3, sp = Math.hypot(vel[k], vel[k + 1], vel[k + 2])
      if (sp > 2) { const f = 2 / sp; vel[k] *= f; vel[k + 1] *= f; vel[k + 2] *= f }
    }
    grab = null; dragPlane = null; canvas.classList.remove('grabbing')
  }
  canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release)
  function bodyCentroid() { let c = [0, 0, 0]; for (let i = 0; i < NP; i++) { c[0] += x[i * 3]; c[1] += x[i * 3 + 1]; c[2] += x[i * 3 + 2] } return V.mul(c, 1 / NP) }

  function nudge() {
    const c = bodyCentroid(), w = [0.6, 3.6 * (Math.random() < 0.5 ? -1 : 1), 0.4]
    for (let i = 0; i < NP; i++) {
      const r = V.sub(p3(x, i), c), tw = V.cross(w, r)
      vel[i * 3] += tw[0]; vel[i * 3 + 1] += 3.4 + tw[1]; vel[i * 3 + 2] += tw[2]
    }
  }
  // ── UI ──
  const $ = id => document.getElementById(id)
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
    variety = b.dataset.v
    document.querySelectorAll('.sw').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'))
  }))
  $('firm').addEventListener('input', e => { settings.firm = e.target.value / 100; $('firmV').textContent = e.target.value })
  $('damp').addEventListener('input', e => { settings.damp = e.target.value / 100; $('dampV').textContent = e.target.value })
  $('nudge').addEventListener('click', nudge)
  $('reset').addEventListener('click', () => resetSim(false))
  const setPause = p => { settings.paused = p; $('pause').textContent = p ? 'Play' : 'Pause'; $('pause').setAttribute('aria-pressed', p) }
  $('pause').addEventListener('click', () => setPause(!settings.paused))
  $('meshBtn').addEventListener('click', () => { settings.mesh = !settings.mesh; $('meshBtn').setAttribute('aria-pressed', settings.mesh) })
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return
    if (e.code === 'Space') { e.preventDefault(); setPause(!settings.paused) }
    else if (e.key === 'n' || e.key === 'N') nudge()
    else if (e.key === 'r' || e.key === 'R') resetSim(false)
  })
  // embed: the page that hosts us can drive the variety
  addEventListener('message', e => {
    const d = e.data || {}
    if (VARIETIES[d.variety]) variety = d.variety
    if (d.cmd === 'nudge') nudge(); else if (d.cmd === 'reset') resetSim(false)
  })

  resetSim(false)
  window.__citrus = { centroid: () => bodyCentroid(), np: NP, nt: NT, nrv: NRV }
  const U = new Float32Array(80)
  let last = performance.now(), acc = 0, time = 0, lying = 0
  document.addEventListener('visibilitychange', () => { last = performance.now() })
  function frame(now) {
    resize(); camera()
    let dtf = Math.min(0.1, (now - last) / 1000); last = now
    if (!settings.paused) {
      acc += dtf; time += dtf
      let steps = 0
      while (acc >= DT && steps < 4) { for (let s = 0; s < SUB; s++) substep(); acc -= DT; steps++ }
      if (steps === 4) acc = 0
      for (let i = 0; i < NP * 3; i++) if (!Number.isFinite(x[i]) || Math.abs(x[i]) > 50) { resetSim(true); break }
      if (EMBED && !grab) { // as a page background there is no Reset button: a slice left lying down stands back up
        const up = 1 - 2 * (bodyQ[0] * bodyQ[0] + bodyQ[2] * bodyQ[2])   // world-up of the rest-up axis
        let ke = 0; for (let i = 0; i < NP * 3; i++) ke += vel[i] * vel[i]
        lying = (up < 0.85 && ke / NP < 0.02) ? lying + dtf : 0
        if (lying > 4) { resetSim(true); lying = 0 }
      }
    }
    updateRender()
    const bf = bodyFrame(), col = VARIETIES[variety]
    U.set(viewProj, 0); U.set(lightVP, 16)
    U.set([eye[0], eye[1], eye[2], time], 32); U.set([W, H, 1 / W, 1 / H], 36)
    U.set([bf.R[0], bf.R[1], bf.R[2], 0], 40); U.set([bf.R[3], bf.R[4], bf.R[5], 0], 44); U.set([bf.R[6], bf.R[7], bf.R[8], 0], 48)
    U.set([bf.c[0], bf.c[1], bf.c[2], 1.0], 52); U.set([REST_C[0], REST_C[1], REST_C[2], 0], 56)
    U.set([...col.flesh, 1], 60); U.set([...col.pith, 1], 64); U.set([...col.rind, 1], 68)
    U.set([T / 2, 0.55, settings.firm, 0], 72)
    device.queue.writeBuffer(ubuf, 0, U)
    device.queue.writeBuffer(pbuf, 0, new Float32Array([1.12, time % 100, 0, 0]))
    device.queue.writeBuffer(jelV, 0, RVB)
    if (settings.mesh) {
      for (let e = 0; e < NE; e++) { const a = EDGE[e * 2] * 3, b = EDGE[e * 2 + 1] * 3; dbgData.set([x[a], x[a + 1], x[a + 2], x[b], x[b + 1], x[b + 2]], e * 6) }
      device.queue.writeBuffer(dbgV, 0, dbgData)
    }
    const enc = device.createCommandEncoder()
    { // shadow
      const p = enc.beginRenderPass({ colorAttachments: [], depthStencilAttachment: { view: shadowTex.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } })
      p.setPipeline(shadowP); p.setBindGroup(0, shadowBG); p.setVertexBuffer(0, jelV); p.setIndexBuffer(jelI, 'uint32'); p.drawIndexed(IDX.length); p.end()
    }
    { // studio
      const p = enc.beginRenderPass({ colorAttachments: [{ view: sceneT.createView(), clearValue: [0.9, 0.86, 0.8, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depthA.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } })
      p.setPipeline(stageP); p.setBindGroup(0, stageBG); p.setVertexBuffer(0, cycV); p.setIndexBuffer(cycI, 'uint32'); p.drawIndexed(cyc.i.length); p.end()
    }
    { // back faces → view-ray distance
      const p = enc.beginRenderPass({ colorAttachments: [{ view: backT.createView(), clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depthB.createView(), depthClearValue: 0, depthLoadOp: 'clear', depthStoreOp: 'store' } })
      p.setPipeline(backP); p.setBindGroup(0, backBG); p.setVertexBuffer(0, jelV); p.setIndexBuffer(jelI, 'uint32'); p.drawIndexed(IDX.length); p.end()
    }
    { // jelly front faces
      const p = enc.beginRenderPass({ colorAttachments: [{ view: jellyT.createView(), clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depthB.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } })
      p.setPipeline(jellyP); p.setBindGroup(0, jellyBG); p.setVertexBuffer(0, jelV); p.setVertexBuffer(1, jelR); p.setIndexBuffer(jelI, 'uint32'); p.drawIndexed(IDX.length); p.end()
    }
    { // post (+ optional mesh overlay)
      const p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'store' }] })
      p.setPipeline(postP); p.setBindGroup(0, postBG); p.draw(3)
      if (settings.mesh) { p.setPipeline(dbgP); p.setBindGroup(0, dbgBG); p.setVertexBuffer(0, dbgV); p.draw(NE * 2) }
      p.end()
    }
    device.queue.submit([enc.finish()])
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
  device.lost.then(() => document.body.classList.add('nogpu'))
}
main().catch(err => { console.error(err); document.body.classList.add('nogpu') })
</script>
</body>
</html>
