<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>2호선 스튜디오 3D 둘러보기</title>
<!-- 숨긴 미리보기 — 스튜디오 입구부터 수업 자리까지. 사진을 보고 만든 공간(치수는 사진 기준 어림).
     그림 = public/studio-tour/art(사진에서 그림만 잘라 낸 것).
     ⚠️ 벽의 와이파이·출입 번호 쪽지와 결제 QR 은 공개 주소에 올리면 안 된다 — 넣지 말 것. -->
<style>
  :root{--ink:#3d3550;--glass:rgba(255,255,255,.72);--line:rgba(255,255,255,.85);--acc:#6f5bd6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e4f6;color:var(--ink);
    font-family:Nunito,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.04em}
  .brand span{font-size:12px;font-weight:700;opacity:.65}
  .dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);width:min(520px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .say{align-self:center;width:min(440px,100%);
    padding:12px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:14px;font-weight:700;line-height:1.5;text-align:center;box-shadow:0 8px 26px rgba(70,50,120,.14);pointer-events:none}
  .say small{display:block;font-size:12px;font-weight:600;opacity:.65;margin-top:2px}
  .bar{pointer-events:auto;
    padding:8px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 26px rgba(70,50,120,.14)}
  .stops{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .stops button{min-height:44px;border:0;border-radius:13px;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;padding:4px 2px}
  .stops button.on{background:var(--acc);color:#fff}
  .walk{display:block;width:100%;min-height:44px;margin-top:6px;border:0;border-radius:13px;background:#fff;color:var(--acc);font:inherit;font-size:13.5px;font-weight:900;cursor:pointer}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:32px;text-align:center;font-weight:700}
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three-0.178/three.module.min.js" } }</script>
</head>
<body>
<div class="top"><div class="brand"><b>2HOSUN STUDIO</b><span>미리보기 · 공간 둘러보기</span></div></div>
<div class="dock">
<div class="say" id="say"></div>
<div class="bar">
  <div class="stops" id="stops"></div>
  <button class="walk" id="walk">입구부터 걸어 들어가기</button>
</div>
</div>
<div id="fade"></div>
<div class="err" id="err">이 기기에서는 3D 화면을 열 수 없어요.</div>

<script type="module">
import * as THREE from 'three'

// ── 공간(미터). x = 현관 쪽 벽 → 창가, z = 흰 벽 → 안쪽. 사진에서 어림한 값 ──────────
const W = 7.4, D = 4.5, H = 2.6
const DOOR = { x0: 0.72, x1: 1.6, h: 2.02 }
const TILE = { x: 1.9, z: 1.85 }
const C = { white:'#f3f0ea', mint:'#d5e2b8', khaki:'#dcd9b6', green:'#1f9148', floor:'#b5763e', ceil:'#f0ece6', door:'#f3ab14', tile:'#46454a',
            wood:'#5a2f1b', pink:'#ecd5e0', grey:'#cfc6be', orange:'#e8622a', neon:'#7df03c', seat:'#3f5a3c', chairback:'#9a4a22', easel:'#1f9a55' }

let renderer
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }) }
catch { document.getElementById('err').style.display = 'flex'; throw new Error('no webgl') }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.NeutralToneMapping
renderer.toneMappingExposure = 1.02
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.prepend(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color('#e9e4f6')
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.05, 60)

// ── 도우미 ───────────────────────────────────────────────
const mats = new Map()
const mat = (color, rough = .82, metal = 0) => {
  const k = `${color}|${rough}|${metal}`
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }))
  return mats.get(k)
}
function box(w, h, d, x, y, z, m, parent = scene, shadow = true) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof m === 'string' ? mat(m) : m)
  o.position.set(x, y, z); o.castShadow = shadow; o.receiveShadow = true; parent.add(o); return o
}
function cyl(r0, r1, h, x, y, z, m, parent = scene, seg = 16) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), typeof m === 'string' ? mat(m) : m)
  o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o
}
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry)
  t.anisotropy = 8
  return t
}
const loader = new THREE.TextureLoader()
function artMat(name) {
  const t = loader.load(`art/${name}.jpg`, () => { pending-- })
  pending++
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8
  return new THREE.MeshStandardMaterial({ map: t, roughness: .62 })
}
let pending = 0

// 그림 — 앞면에만 그림, 옆은 캔버스 두께. (cx,cy,cz) 가운데, ry 회전
function painting(name, w, h, cx, cy, cz, ry = 0, depth = .03, tilt = 0, side = '#efe9df') {
  const s = mat(side), g = new THREE.BoxGeometry(w, h, depth)
  const m = new THREE.Mesh(g, [s, s, s, s, artMat(name), s])
  m.position.set(cx, cy, cz); m.rotation.set(0, ry, 0); m.rotateX(tilt)
  m.castShadow = true; m.receiveShadow = true; scene.add(m); return m
}

// ── 바닥 · 벽 · 천장 ─────────────────────────────────────
const planks = canvasTex(1024, 1024, (x, w, h) => {
  x.fillStyle = C.floor; x.fillRect(0, 0, w, h)
  const rows = 12, rh = h / rows
  for (let r = 0; r < rows; r++) {
    let px = -((r * 197) % 260)
    while (px < w) {
      const pw = 240 + (r * 71 + px * 3 & 127)
      const t = (Math.sin(r * 12.9 + px * .07) + 1) / 2
      x.fillStyle = `rgb(${168 + t * 30 | 0},${104 + t * 22 | 0},${54 + t * 14 | 0})`
      x.fillRect(px + 1, r * rh + 1, pw - 2, rh - 2)
      x.globalAlpha = .1; x.strokeStyle = '#4a2410'
      for (let i = 0; i < 7; i++) { const yy = r * rh + 6 + i * rh / 7; x.beginPath(); x.moveTo(px, yy); x.bezierCurveTo(px + pw * .3, yy + 4, px + pw * .6, yy - 4, px + pw, yy + 1); x.stroke() }
      x.globalAlpha = 1
      px += pw
    }
  }
}, 2.2, 1.4)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ map: planks, roughness: .5 }))
floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, D / 2); floor.receiveShadow = true; scene.add(floor)

const tileTex = canvasTex(256, 256, (x, w, h) => { x.fillStyle = C.tile; x.fillRect(0, 0, w, h); x.strokeStyle = '#2d2c30'; x.lineWidth = 5; x.strokeRect(0, 0, w, h) }, 3.2, 3.1)
const tile = new THREE.Mesh(new THREE.PlaneGeometry(TILE.x, TILE.z), new THREE.MeshStandardMaterial({ map: tileTex, roughness: .7 }))
tile.rotation.x = -Math.PI / 2; tile.position.set(TILE.x / 2, .004, TILE.z / 2); tile.receiveShadow = true; scene.add(tile)
box(TILE.x, .012, .05, TILE.x / 2, .006, TILE.z, '#a3773f', scene, false)
box(.05, .012, TILE.z, TILE.x, .006, TILE.z / 2, '#a3773f', scene, false)

// 삼 러그
const jute = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#c2a273'; x.fillRect(0, 0, w, h)
  for (let i = 0; i < 2600; i++) { x.fillStyle = i % 2 ? 'rgba(90,60,30,.16)' : 'rgba(255,240,210,.14)'; x.fillRect(Math.random() * w, Math.random() * h, 5, 1.4) }
}, 3, 4)
const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.45), new THREE.MeshStandardMaterial({ map: jute, roughness: 1 }))
rug.rotation.x = -Math.PI / 2; rug.position.set(1.05, .008, 3.15); rug.receiveShadow = true; scene.add(rug)

function wallN() {
  // 흰 벽 — 문 자리를 비운다
  const t = .12
  box(DOOR.x0, H, t, DOOR.x0 / 2, H / 2, -t / 2, C.white)
  box(W - DOOR.x1, H, t, (W + DOOR.x1) / 2, H / 2, -t / 2, C.white)
  box(DOOR.x1 - DOOR.x0, H - DOOR.h, t, (DOOR.x0 + DOOR.x1) / 2, (H + DOOR.h) / 2, -t / 2, C.white)
  // 천장 아래 턱 · 굽도리
  box(W, .34, .05, W / 2, H - .17, .025, '#f7f4ef', scene, false)
  box(W - DOOR.x1, .1, .02, (W + DOOR.x1) / 2, .05, .01, '#e6e0d6', scene, false)
  // 문틀(크림)
  const fr = '#efe3bf'
  box(.09, DOOR.h + .08, .17, DOOR.x0 - .03, (DOOR.h + .08) / 2, 0, fr)
  box(.09, DOOR.h + .08, .17, DOOR.x1 + .03, (DOOR.h + .08) / 2, 0, fr)
  box(DOOR.x1 - DOOR.x0 + .15, .1, .17, (DOOR.x0 + DOOR.x1) / 2, DOOR.h + .04, 0, fr)
  // 비상구 표지
  const sign = canvasTex(256, 96, (x, w, h) => {
    x.fillStyle = '#f4f2c4'; x.fillRect(0, 0, w, h); x.fillStyle = '#157a3d'; x.fillRect(10, 12, 72, 72)
    x.fillStyle = '#f4f2c4'; x.font = '900 46px sans-serif'; x.fillText('→', 18, 64)
    x.fillStyle = '#157a3d'; x.font = '900 58px "Apple SD Gothic Neo",sans-serif'; x.fillText('비상구', 92, 68)
  })
  const sg = new THREE.Mesh(new THREE.PlaneGeometry(.42, .16), new THREE.MeshStandardMaterial({ map: sign, roughness: .6 }))
  sg.position.set((DOOR.x0 + DOOR.x1) / 2, DOOR.h + .2, .06); scene.add(sg)
}
wallN()
box(.12, H, D, -.06, H / 2, D / 2, C.mint)                       // 현관 쪽 민트 벽(창은 아래서 뚫린 듯 얹는다)
box(.12, H, D, W + .06, H / 2, D / 2, C.khaki)                   // 창가 벽
const greenWall = box(W - 4.9, H, .12, (W + 4.9) / 2, H / 2, D + .06, C.green)     // 초록 벽
const greenLow = box(W - 4.9, .22, .12, (W + 4.9) / 2, .11, D + .06, C.green)        // 전체 보기 때 낮게 자른 벽
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W + .3, D + .3), mat(C.ceil, .95))
ceiling.rotation.x = Math.PI / 2; ceiling.position.set(W / 2, H, D / 2); scene.add(ceiling)

// 문 — 경첩을 왼쪽에 두고 안쪽으로 열린다
const doorPivot = new THREE.Group(); doorPivot.position.set(DOOR.x0, 0, -.02); scene.add(doorPivot)
const doorW = DOOR.x1 - DOOR.x0
box(doorW, DOOR.h, .05, doorW / 2, DOOR.h / 2, 0, mat(C.door, .55), doorPivot)
cyl(.018, .018, .12, doorW - .08, 1.02, .05, mat('#c8c8cc', .3, .8), doorPivot)
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(.38, .3), artMat('doorprint')); m.position.set(doorW / 2, 1.42, .028); doorPivot.add(m) }

// 문 바깥 복도(문 앞에 섰을 때만 보인다)
box(4, .02, 2.4, 1.2, -.01, -1.3, '#8f8c88', scene, false)
box(.1, H, 2.4, -.9, H / 2, -1.3, '#d9d5cd', scene, false)
box(.1, H, 2.4, 3.2, H / 2, -1.3, '#d9d5cd', scene, false)
box(4.2, H, .1, 1.15, H / 2, -2.5, '#cfcac1', scene, false)
box(4.2, .02, 2.4, 1.2, H, -1.3, '#e8e4dd', scene, false)
const corridorLight = new THREE.PointLight('#fff1dc', 5, 5); corridorLight.position.set(1.15, 2.3, -1.2); scene.add(corridorLight)

// 창 — 벽 안쪽에 빛나는 판을 대고 창틀을 얹는다
function windowPane(wall, a0, a1, y0, y1, tint) {
  const glow = new THREE.MeshBasicMaterial({ color: tint })
  const len = a1 - a0, h = y1 - y0, mid = (a0 + a1) / 2, yc = (y0 + y1) / 2, frame = '#23232a'
  const sx = wall === 'W' ? .004 : W - .004
  const p = new THREE.Mesh(new THREE.PlaneGeometry(len, h), glow)
  p.position.set(sx, yc, mid); p.rotation.y = wall === 'W' ? Math.PI / 2 : -Math.PI / 2; scene.add(p)
  const fx = wall === 'W' ? .025 : W - .025
  box(.05, .05, len + .05, fx, y0, mid, frame); box(.05, .05, len + .05, fx, y1, mid, frame)
  box(.05, h, .05, fx, yc, a0, frame); box(.05, h, .05, fx, yc, a1, frame)
  box(.05, .05, len, fx, y0 + h * .34, mid, frame)
}
windowPane('W', 2.0, 4.3, .95, 2.2, '#fbf4e6')
windowPane('E', 1.15, 2.75, .9, 2.1, '#dff1f4')
box(.14, .03, 2.4, .08, .93, 3.15, '#d7c9a6')
// 유리창에 붙인 포스터
painting('winposter', .5, 1.05, .045, 1.6, 2.5, Math.PI / 2, .006)
painting('fine', .62, .78, .045, 1.75, 3.5, Math.PI / 2, .006)

// 창가 흰 커튼(묶어 올린 모양)
const curtainTex = canvasTex(256, 64, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, 0)
  for (let i = 0; i <= 10; i++) g.addColorStop(i / 10, i % 2 ? '#fff' : '#e7e3da')
  x.fillStyle = g; x.fillRect(0, 0, w, h)
})
{
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(1.5, 0); s.lineTo(1.5, 1.2); s.quadraticCurveTo(.9, .7, .36, .42); s.quadraticCurveTo(.3, .15, 0, 0)
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshStandardMaterial({ map: curtainTex, side: THREE.DoubleSide, roughness: .9, transparent: true, opacity: .97 }))
  m.rotation.set(Math.PI, Math.PI / 2, 0); m.position.set(W - .07, 2.2, 1.2); m.scale.set(1.08, 1, 1); scene.add(m)
}

// ── 빛 ─────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight('#fff7ea', '#b59878', 1.75))
const sun = new THREE.DirectionalLight('#fff0d6', 1.7)
sun.position.set(W + 2.5, 3.4, 2.6); sun.target.position.set(4, 0, 2.6); scene.add(sun, sun.target)
sun.castShadow = true; sun.shadow.mapSize.set(1536, 1536)
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 5, bottom: -5, near: .5, far: 16 })
sun.shadow.bias = -.0006; sun.shadow.normalBias = .02
const west = new THREE.PointLight('#fff3df', 6, 7); west.position.set(.7, 1.9, 3.1); scene.add(west)
const chanLight = new THREE.PointLight('#ffe7c4', 5, 6); chanLight.position.set(5.2, 2.05, 1.95); scene.add(chanLight)
const lampLight = new THREE.PointLight('#ffd9a0', 4, 3.4); lampLight.position.set(6.95, 1.85, 3.95); scene.add(lampLight)

// ── 흰 벽의 그림 — 사진 2 의 픽셀 자리를 그대로 옮긴다 ──
const px2x = p => 1.6 + (p - 195) / 340
const py2y = p => (1440 - p) / 350
function onWall(name, x0, y0, x1, y1, depth = .03) {
  const w = (x1 - x0) / 340, h = (y1 - y0) / 350
  return painting(name, w, h, px2x((x0 + x1) / 2), py2y((y0 + y1) / 2), depth / 2 + .002, 0, depth)
}
onWall('berries', 252, 562, 451, 727, .035)
onWall('rose', 517, 530, 905, 860, .04)
onWall('grey', 908, 534, 1043, 717)
onWall('small1', 1177, 527, 1266, 617)
onWall('small2', 1292, 541, 1440, 640)
onWall('man', 1085, 673, 1357, 1050, .02)
onWall('pale', 954, 812, 1033, 916)
onWall('land', 1130, 1098, 1452, 1253)
onWall('pc1', 288, 805, 340, 880, .004)
onWall('pc2', 230, 874, 270, 934, .004)
onWall('pc3', 295, 892, 380, 946, .004)
painting('greenprint', .4, .72, 5.92, 1.55, .006, 0, .004)

// 현관 쪽 민트 벽 포스터
painting('cats', .5, .42, .018, 1.98, .92, Math.PI / 2, .02, 0, '#b8956a')
painting('house', .26, .28, .008, 1.5, .98, Math.PI / 2, .012)
painting('purple', .32, .46, .008, 1.05, .98, Math.PI / 2, .012)

// ── 현관 ───────────────────────────────────────────────
// 나무 신발장(민트 벽 앞)
{
  const c = '#e7ddcc'
  const x = .17, z0 = .42, z1 = 1.5
  for (const z of [z0, z1]) box(.28, .86, .025, x, .43, z, c)
  for (let i = 0; i < 5; i++) box(.28, .022, z1 - z0, x, .07 + i * .19, (z0 + z1) / 2, c)
}
function slipper(col, x, y, z, ry = 0, s = 1, sole = '#d8d2c8') {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; g.scale.setScalar(s)
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(.042, .14, 4, 10), mat(sole)); b.rotation.x = Math.PI / 2; b.scale.y = 1; b.scale.z = .3; b.position.y = .012; g.add(b)
  const t = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(col)); t.scale.set(.96, .75, 1.15); t.position.set(0, .018, .05); g.add(t)
  g.traverse(o => { o.castShadow = true }); scene.add(g); return g
}
const pair = (c, x, y, z, ry, s, sole) => { const dx = Math.cos(ry) * .062, dz = -Math.sin(ry) * .062; slipper(c, x - dx, y, z - dz, ry, s, sole); slipper(c, x + dx, y, z + dz, ry, s, sole) }
pair('#efe5d5', .17, .262, .7, Math.PI / 2, .9); pair('#1d6e45', .17, .262, 1.25, Math.PI / 2, .9)
pair('#b8b1a8', .17, .082, .75, Math.PI / 2, .9); pair('#b8b1a8', .17, .272 - .19, 1.2, Math.PI / 2, .9)
pair('#e8b92b', .95, .01, 1.05, -.2, 1, '#e0ac20')
pair('#c5bdb0', .5, .01, 1.45, .25, 1)
pair('#e6e1da', 1.32, .01, 1.5, 3, 1, '#b9b4ad')
pair(C.pink, 1.62, .01, 2.0, .3, 1)

// 작은 화분 · 손소독제
cyl(.05, .04, .08, .18, .92, .55, '#c9673f'); cyl(.05, .04, .08, .18, .92, 1.3, '#b98a5b')
for (let i = 0; i < 8; i++) { const a = i * .8; const l = cyl(.004, .008, .2, .18 + Math.cos(a) * .05, 1.05, 1.3 + Math.sin(a) * .05, '#2b7a3d'); l.rotation.set(Math.sin(a) * .7, 0, -Math.cos(a) * .7) }
cyl(.03, .03, .14, .18, .95, .85, '#f4f4f6')

    pos.lerpVectors(fromPos, toPos, e); look.lerpVectors(fromLook, toLook, e); doorA = doorFrom + (doorTo - doorFrom) * e
    if (t === 1) { if (walking) walkTimer = setTimeout(step, 1300); else paint(cur) }
  }
  yaw += (yawGoal - yaw) * Math.min(1, dt * 9); pitch += (pitchGoal - pitch) * Math.min(1, dt * 9)
  doorPivot.rotation.y = -doorA
  dir.copy(look).sub(pos)
  q.setFromAxisAngle(up, yaw); dir.applyQuaternion(q)
  right.crossVectors(dir, up).normalize(); q.setFromAxisAngle(right, pitch); dir.applyQuaternion(q)
  camera.position.copy(pos); camera.lookAt(tmp.copy(pos).add(dir))
  renderer.render(scene, camera); frames++
}
paint(0)
requestAnimationFrame(frame)
window.__studio = { go: i => { stopWalk(); go(i) }, jump: i => { cur = i; paint(i); jump(i) }, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pending }),
  look: (y, p = 0) => { yawGoal = y; pitchGoal = p }, poke: () => { dirty = 10 }, frames: () => frames, tick: n => { for (let i = 0; i < n; i++) { last -= 100; advance(performance.now()) } }, stop: () => cur }
</script>
